name: Apply QAMVIO Secure Flutter Update

on:
  push:
    branches: [ "flutter/qamvio-core" ]
    paths:
      - "secure_update/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter/qamvio-core
          fetch-depth: 0

      - name: Decode and apply secure source patch
        run: |
          cat secure_update/parts/part_* > /tmp/qamvio-secure.patch.gz.b64
          test "$(sha256sum /tmp/qamvio-secure.patch.gz.b64 | awk '{print $1}')" = "a315573c4db98cc48f8ad7bbda0c95fc8379698b356a28eadf54904e803ba02c"
          base64 -d /tmp/qamvio-secure.patch.gz.b64 | gzip -dc > /tmp/qamvio-secure.patch
          git apply --check -p2 /tmp/qamvio-secure.patch
          git apply -p2 /tmp/qamvio-secure.patch
          git add flutter_app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.qamvio --project-name qamvio_pos .

      - name: Harden generated Android app
        working-directory: flutter_app
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest=Path("android/app/src/main/AndroidManifest.xml")
          text=manifest.read_text()
          attrs=[]
          if 'android:allowBackup=' not in text:
              attrs.append('android:allowBackup="false"')
          if 'android:fullBackupContent=' not in text:
              attrs.append('android:fullBackupContent="false"')
          if 'android:usesCleartextTraffic=' not in text:
              attrs.append('android:usesCleartextTraffic="false"')
          if attrs:
              replacement='<application\n        '+'\n        '.join(attrs)
              text=text.replace('<application',replacement,1)
              manifest.write_text(text)

          for name in ("android/app/build.gradle.kts","android/app/build.gradle"):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text()
              s=s.replace('minSdk = flutter.minSdkVersion','minSdk = 24')
              s=s.replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 24')
              p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: flutter_app
        run: flutter test

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload validated secure APK
        uses: actions/upload-artifact@v4
        with:
          name: QAMVIO-Secure-Validated-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Commit validated secure source
        run: |
          git clean -fdx flutter_app
          git restore --worktree flutter_app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Add secure local login and encrypted Flutter storage"
            git push origin HEAD:flutter/qamvio-core
          fi
