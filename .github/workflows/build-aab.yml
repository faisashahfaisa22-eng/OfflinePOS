name: Build OfflinePOS Signed APK AAB v11

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore upload keystore
        env:
          OFFLINEPOS_KEYSTORE_BASE64: ${{ secrets.OFFLINEPOS_KEYSTORE_BASE64 }}
        run: |
            echo "$OFFLINEPOS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/offlinepos-upload.jks"
          test -n "$OFFLINEPOS_KEYSTORE_BASE64"
          echo "$OFFLINEPOS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/offlinepos-upload.jks"

      - name: Build signed APK
        env:
          OFFLINEPOS_KEYSTORE_PATH: ${{ runner.temp }}/offlinepos-upload.jks
          OFFLINEPOS_KEYSTORE_PASSWORD: ${{ secrets.OFFLINEPOS_KEYSTORE_PASSWORD }}
          OFFLINEPOS_KEY_ALIAS: ${{ secrets.OFFLINEPOS_KEY_ALIAS }}
          OFFLINEPOS_KEY_PASSWORD: ${{ secrets.OFFLINEPOS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build signed AAB
        env:
          OFFLINEPOS_KEYSTORE_PATH: ${{ runner.temp }}/offlinepos-upload.jks
          OFFLINEPOS_KEYSTORE_PASSWORD: ${{ secrets.OFFLINEPOS_KEYSTORE_PASSWORD }}
          OFFLINEPOS_KEY_ALIAS: ${{ secrets.OFFLINEPOS_KEY_ALIAS }}
          OFFLINEPOS_KEY_PASSWORD: ${{ secrets.OFFLINEPOS_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify APK
        run: jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release.apk

      - name: Verify AAB
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePOS-v11-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePOS-v11-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
