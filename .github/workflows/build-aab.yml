name: Build OfflinePOS Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Restore keystore
      env:
        OFFLINEPOS_KEYSTORE_BASE64: ${{ secrets.OFFLINEPOS_KEYSTORE_BASE64 }}
      run: |
        echo "$OFFLINEPOS_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/offlinepos-upload.jks


    - name: Build Signed APK
      env:
        OFFLINEPOS_KEYSTORE_PATH: ${{ runner.temp }}/offlinepos-upload.jks
        OFFLINEPOS_KEYSTORE_PASSWORD: ${{ secrets.OFFLINEPOS_KEYSTORE_PASSWORD }}
        OFFLINEPOS_KEY_ALIAS: ${{ secrets.OFFLINEPOS_KEY_ALIAS }}
        OFFLINEPOS_KEY_PASSWORD: ${{ secrets.OFFLINEPOS_KEY_PASSWORD }}
      run: |
        chmod +x ./gradlew
        ./gradlew :app:assembleRelease --stacktrace


    - name: Build Signed AAB
      env:
        OFFLINEPOS_KEYSTORE_PATH: ${{ runner.temp }}/offlinepos-upload.jks
        OFFLINEPOS_KEYSTORE_PASSWORD: ${{ secrets.OFFLINEPOS_KEYSTORE_PASSWORD }}
        OFFLINEPOS_KEY_ALIAS: ${{ secrets.OFFLINEPOS_KEY_ALIAS }}
        OFFLINEPOS_KEY_PASSWORD: ${{ secrets.OFFLINEPOS_KEY_PASSWORD }}
      run: |
        ./gradlew :app:bundleRelease --stacktrace


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OfflinePOS-v11-APK
        path: app/build/outputs/apk/release/*.apk


    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: OfflinePOS-v11-AAB
        path: app/build/outputs/bundle/release/*.aab
