name: Build OfflinePOS AAB v11

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Gradle
        run: gradle --version

      # This step was missing — without it, the keystore file never exists
      # and signReleaseBundle NullPointerExceptions.
      - name: Restore keystore
        env:
          OFFLINEPOS_KEYSTORE_BASE64: ${{ secrets.OFFLINEPOS_KEYSTORE_BASE64 }}
        run: |
          echo "$OFFLINEPOS_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/offlinepos-upload.jks
          ls -la $RUNNER_TEMP/offlinepos-upload.jks

      - name: Build AAB
        env:
          OFFLINEPOS_KEYSTORE_PATH: ${{ runner.temp }}/offlinepos-upload.jks
          OFFLINEPOS_KEYSTORE_PASSWORD: ${{ secrets.OFFLINEPOS_KEYSTORE_PASSWORD }}
          OFFLINEPOS_KEY_ALIAS: ${{ secrets.OFFLINEPOS_KEY_ALIAS }}
          OFFLINEPOS_KEY_PASSWORD: ${{ secrets.OFFLINEPOS_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePOS-v11-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
