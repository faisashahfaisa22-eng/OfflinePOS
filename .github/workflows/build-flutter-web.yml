name: Build QAMVIO Chrome PWA

on:
  push:
    branches:
      - release/flutter-web-v16
    paths:
      - "flutter_app/**"
      - "app/src/main/res/drawable/qamvio_icon.png"
      - ".github/workflows/build-flutter-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qamvio-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/flutter-web-v16

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f flutter_app/web/index.html ]; then
            cd flutter_app
            flutter create --platforms=web --org com.offlinepos --project-name qamvio_pos .
            cd ..

            python3 - <<'PY'
          import json
          from pathlib import Path

          web = Path("flutter_app/web")
          index = web / "index.html"
          text = index.read_text(encoding="utf-8")
          text = text.replace("<title>qamvio_pos</title>", "<title>QAMVIO POS</title>")
          text = text.replace(
              '<meta name="description" content="A new Flutter project.">',
              '<meta name="description" content="QAMVIO POS — installable offline sales, inventory and accounts app for laptops.">',
          )
          index.write_text(text, encoding="utf-8")

          manifest = web / "manifest.json"
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data.update({
              "name": "QAMVIO POS",
              "short_name": "QAMVIO",
              "description": "Offline sales, inventory and accounts for shops.",
              "display": "standalone",
              "background_color": "#071b38",
              "theme_color": "#075ee8",
              "start_url": ".",
              "scope": "./"
          })
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flutter_app/web
            git commit -m "Add QAMVIO Chrome web scaffold"
            git push origin HEAD:release/flutter-web-v16
          fi

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Set up encrypted SQLite WASM
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          dart run sqflite_common_ffi_web:setup --force
          curl -fL --retry 3             "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.7.0/sqlite3mc.wasm"             -o web/sqlite3mc.wasm
          echo "7271cf8fdf625b03d41dd43ae1d500cf855755f35ca575372022315b15f5a19e  web/sqlite3mc.wasm" | sha256sum -c -
          test -s web/sqflite_sw.js

      - name: Brand PWA install icons
        shell: bash
        run: |
          set -euo pipefail
          MARKER="flutter_app/web/.qamvio-brand-icons"
          if [ ! -f "$MARKER" ]; then
            python3 -m venv /tmp/qamvio-pwa-icons
            /tmp/qamvio-pwa-icons/bin/python -m pip install --disable-pip-version-check pillow
            /tmp/qamvio-pwa-icons/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Image.open("app/src/main/res/drawable/qamvio_icon.png").convert("RGBA")
          brand = (7, 94, 232, 255)

          def flatten_square(size, inner=None):
              target = inner or size
              ratio = min(target / src.width, target / src.height)
              resized = src.resize(
                  (max(1, round(src.width * ratio)), max(1, round(src.height * ratio))),
                  Image.Resampling.LANCZOS,
              )
              bg = Image.new("RGBA", (size, size), brand)
              x = (size - resized.width) // 2
              y = (size - resized.height) // 2
              bg.alpha_composite(resized, (x, y))
              return bg.convert("RGB")

          outputs = {
              "flutter_app/web/icons/Icon-192.png": flatten_square(192),
              "flutter_app/web/icons/Icon-512.png": flatten_square(512),
              "flutter_app/web/icons/Icon-maskable-192.png": flatten_square(192, 154),
              "flutter_app/web/icons/Icon-maskable-512.png": flatten_square(512, 410),
              "flutter_app/web/favicon.png": flatten_square(64),
          }
          for path, image in outputs.items():
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              image.save(path, "PNG", optimize=True)
          PY
            touch "$MARKER"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flutter_app/web
            git commit -m "Brand QAMVIO Chrome install icons"
            git push origin HEAD:release/flutter-web-v16
          fi

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Test
        working-directory: flutter_app
        run: flutter test

      - name: Test encrypted database in served Chrome
        shell: bash
        run: |
          set -euo pipefail

          cat > flutter_app/lib/web_database_smoke_main.dart <<'DART'
          import 'package:flutter/widgets.dart';
          import 'package:web/web.dart' as web;
          import 'package:qamvio_pos/core/database/app_database.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final phase = Uri.base.queryParameters['phase'] ?? 'write';
            final app = AppDatabase.instance;
            final goodKey = List<int>.generate(32, (i) => i + 1);
            final wrongKey = List<int>.generate(32, (i) => 255 - i);
            const id = 'web-smoke-product-v16';

            void done(String value) {
              web.document.title = value;
              web.document.body?.textContent = value;
            }

            try {
              if (phase == 'wrong') {
                await app.unlock(wrongKey);
                try {
                  await app.database;
                  done('QAMVIO_WRONG_KEY_FAIL');
                } catch (_) {
                  done('QAMVIO_WRONG_KEY_PASS');
                } finally {
                  await app.lock();
                }
                return;
              }

              await app.unlock(goodKey);
              final db = await app.database;
              final cipher = await db.rawQuery('PRAGMA cipher_version');
              final cipherVersion =
                  cipher.isEmpty ? '' : cipher.first.values.first?.toString() ?? '';
              if (cipherVersion.isEmpty) {
                throw StateError('Encrypted SQLite cipher is unavailable.');
              }

              if (phase == 'write') {
                await app.saveProduct(
                  id: id,
                  name: 'Web Smoke Product',
                  stock: 3,
                  price: 10,
                  cost: 4,
                );
                await app.lock();
                done('QAMVIO_WRITE_PASS cipher=$cipherVersion');
                return;
              }

              if (phase == 'read') {
                final rows = await db.query(
                  'products',
                  where: 'id=?',
                  whereArgs: [id],
                );
                if (rows.length != 1 ||
                    rows.first['name'] != 'Web Smoke Product') {
                  throw StateError('Persisted browser business data was not found.');
                }

                await app.deleteFile();
                await app.unlock(goodKey);
                final fresh = await app.database;
                final deletedRows = await fresh.query(
                  'products',
                  where: 'id=?',
                  whereArgs: [id],
                );
                if (deletedRows.isNotEmpty) {
                  throw StateError('Browser database delete/recreate failed.');
                }
                await app.lock();
                done('QAMVIO_READ_PASS cipher=$cipherVersion');
                return;
              }

              throw StateError('Unknown smoke-test phase: $phase');
            } catch (e) {
              try {
                await app.lock();
              } catch (_) {}
              done('QAMVIO_DB_FAIL $e');
            }
          }
          DART

          cd flutter_app
          flutter build web --release             --target lib/web_database_smoke_main.dart             --output /tmp/qamvio-db-smoke
          rm -f lib/web_database_smoke_main.dart

          python3 -m http.server 8765 --directory /tmp/qamvio-db-smoke             >/tmp/qamvio-db-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2

          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          profile=/tmp/qamvio-chrome-profile
          rm -rf "$profile"

          run_phase() {
            phase="$1"
            expected="$2"
            output="/tmp/qamvio-db-$phase.html"
            "$chrome"               --headless=new               --no-sandbox               --disable-dev-shm-usage               --enable-unsafe-swiftshader               --use-gl=swiftshader               --user-data-dir="$profile"               --virtual-time-budget=60000               --dump-dom               "http://127.0.0.1:8765/?phase=$phase"               >"$output" 2>/tmp/qamvio-chrome-$phase.log
            cat "$output"
            if ! grep -q "$expected" "$output"; then
              echo "::error::Expected $expected was not emitted in Chrome phase $phase"
              echo "----- Chrome stderr ($phase) -----"
              cat "/tmp/qamvio-chrome-$phase.log" || true
              exit 1
            fi
            if grep -q "QAMVIO_DB_FAIL\|QAMVIO_WRONG_KEY_FAIL" "$output"; then
              echo "::error::Chrome encrypted database smoke test failed in phase $phase"
              echo "----- Chrome stderr ($phase) -----"
              cat "/tmp/qamvio-chrome-$phase.log" || true
              exit 1
            fi
          }

          run_phase write QAMVIO_WRITE_PASS
          run_phase wrong QAMVIO_WRONG_KEY_PASS
          run_phase read QAMVIO_READ_PASS

          echo "PASS: served Chrome persisted encrypted data, rejected a wrong key, and safely recreated the database."

      - name: Build web release
        working-directory: flutter_app
        run: flutter build web --release

      - name: Verify installable web metadata and offline assets
        shell: bash
        run: |
          set -euo pipefail
          test -f flutter_app/build/web/index.html
          test -f flutter_app/build/web/manifest.json
          test -f flutter_app/build/web/flutter_service_worker.js
          test -s flutter_app/build/web/sqlite3mc.wasm
          test -s flutter_app/build/web/sqflite_sw.js
          grep -q '"display": "standalone"' flutter_app/build/web/manifest.json
          grep -q '"orientation": "any"' flutter_app/build/web/manifest.json
          grep -q 'QAMVIO POS' flutter_app/build/web/index.html
          grep -q 'sqlite3mc.wasm' flutter_app/build/web/flutter_service_worker.js
          grep -q 'sqflite_sw.js' flutter_app/build/web/flutter_service_worker.js

      - name: Package web build
        shell: bash
        run: |
          set -euo pipefail
          cd flutter_app/build
          zip -qr "$GITHUB_WORKSPACE/QAMVIO-Chrome-PWA-v16.zip" web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: QAMVIO-Chrome-PWA-v16
          path: QAMVIO-Chrome-PWA-v16.zip
          if-no-files-found: error
          retention-days: 14
