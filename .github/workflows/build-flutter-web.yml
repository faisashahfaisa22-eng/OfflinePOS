name: Build QAMVIO Chrome PWA

on:
  push:
    branches:
      - release/flutter-web-v16
    paths:
      - "flutter_app/**"
      - "app/src/main/res/drawable/qamvio_icon.png"
      - ".github/workflows/build-flutter-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qamvio-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/flutter-web-v16

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f flutter_app/web/index.html ]; then
            cd flutter_app
            flutter create --platforms=web --org com.offlinepos --project-name qamvio_pos .
            cd ..

            python3 - <<'PY'
          import json
          from pathlib import Path

          web = Path("flutter_app/web")
          index = web / "index.html"
          text = index.read_text(encoding="utf-8")
          text = text.replace("<title>qamvio_pos</title>", "<title>QAMVIO POS</title>")
          text = text.replace(
              '<meta name="description" content="A new Flutter project.">',
              '<meta name="description" content="QAMVIO POS — installable offline sales, inventory and accounts app for laptops.">',
          )
          index.write_text(text, encoding="utf-8")

          manifest = web / "manifest.json"
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data.update({
              "name": "QAMVIO POS",
              "short_name": "QAMVIO",
              "description": "Offline sales, inventory and accounts for shops.",
              "display": "standalone",
              "background_color": "#071b38",
              "theme_color": "#075ee8",
              "start_url": ".",
              "scope": "./"
          })
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flutter_app/web
            git commit -m "Add QAMVIO Chrome web scaffold"
            git push origin HEAD:release/flutter-web-v16
          fi

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Set up encrypted SQLite WASM
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          dart run sqflite_common_ffi_web:setup --force
          curl -fL --retry 3             "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.9.4/sqlite3mc.wasm"             -o web/sqlite3mc.wasm
          echo "5a1cfe40252d05bbd174e66351d3c282f69784c6fd0c2d099bf7135c6e91b4ec  web/sqlite3mc.wasm" | sha256sum -c -
          test -s web/sqflite_sw.js

      - name: Brand PWA install icons
        shell: bash
        run: |
          set -euo pipefail
          MARKER="flutter_app/web/.qamvio-brand-icons"
          if [ ! -f "$MARKER" ]; then
            if command -v magick >/dev/null 2>&1; then
              IMG="magick"
            elif command -v convert >/dev/null 2>&1; then
              IMG="convert"
            else
              echo "::error::ImageMagick is required to prepare QAMVIO PWA icons."
              exit 1
            fi

            SRC="app/src/main/res/drawable/qamvio_icon.png"
            test -s "$SRC"

            $IMG "$SRC" -background "#075ee8" -alpha remove -alpha off -resize "192x192^" -gravity center -extent 192x192 -strip flutter_app/web/icons/Icon-192.png
            $IMG "$SRC" -background "#075ee8" -alpha remove -alpha off -resize "512x512^" -gravity center -extent 512x512 -strip flutter_app/web/icons/Icon-512.png
            $IMG "$SRC" -background "#075ee8" -alpha remove -alpha off -resize "154x154" -gravity center -extent 192x192 -strip flutter_app/web/icons/Icon-maskable-192.png
            $IMG "$SRC" -background "#075ee8" -alpha remove -alpha off -resize "410x410" -gravity center -extent 512x512 -strip flutter_app/web/icons/Icon-maskable-512.png
            $IMG "$SRC" -background "#075ee8" -alpha remove -alpha off -resize "64x64^" -gravity center -extent 64x64 -strip flutter_app/web/favicon.png
            touch "$MARKER"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flutter_app/web
            git commit -m "Brand QAMVIO Chrome install icons"
            git push origin HEAD:release/flutter-web-v16
          fi

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Test
        working-directory: flutter_app
        run: flutter test

      - name: Test database runtime in Chrome
        shell: bash
        run: |
          set -euo pipefail
          cat > flutter_app/test/web_database_runtime_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:qamvio_pos/core/database/app_database.dart';

          void main() {
            testWidgets('web database persists encrypted business data', (tester) async {
              final db = AppDatabase.instance;
              final key1 = List<int>.generate(32, (i) => i + 1);
              final key2 = List<int>.generate(32, (i) => 255 - i);

              await db.deleteFile();
              await db.unlock(key1);
              await db.saveProduct(
                id: 'web-smoke-product',
                name: 'Web Smoke Product',
                stock: 3,
                price: 10,
                cost: 4,
              );
              await db.lock();

              // A wrong raw key must not be able to read the encrypted file.
              await db.unlock(key2);
              await expectLater(
                () async => (await db.database).query('products'),
                throwsA(anything),
              );

              // The original key must reopen the same persisted business data.
              await db.unlock(key1);
              final rows = await (await db.database).query(
                'products',
                where: 'id=?',
                whereArgs: ['web-smoke-product'],
              );
              expect(rows.length, 1);
              expect(rows.first['name'], 'Web Smoke Product');

              await db.deleteFile();
            });
          }
          DART
          cd flutter_app
          timeout 150 flutter test --platform chrome test/web_database_runtime_test.dart
          rm -f test/web_database_runtime_test.dart

      - name: Build web release
        working-directory: flutter_app
        run: flutter build web --release

      - name: Verify installable web metadata and offline assets
        shell: bash
        run: |
          set -euo pipefail
          test -f flutter_app/build/web/index.html
          test -f flutter_app/build/web/manifest.json
          test -f flutter_app/build/web/flutter_service_worker.js
          test -s flutter_app/build/web/sqlite3mc.wasm
          test -s flutter_app/build/web/sqflite_sw.js
          grep -q '"display": "standalone"' flutter_app/build/web/manifest.json
          grep -q '"orientation": "any"' flutter_app/build/web/manifest.json
          grep -q 'QAMVIO POS' flutter_app/build/web/index.html
          grep -q 'sqlite3mc.wasm' flutter_app/build/web/flutter_service_worker.js
          grep -q 'sqflite_sw.js' flutter_app/build/web/flutter_service_worker.js

      - name: Package web build
        shell: bash
        run: |
          set -euo pipefail
          cd flutter_app/build
          zip -qr "$GITHUB_WORKSPACE/QAMVIO-Chrome-PWA-v16.zip" web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: QAMVIO-Chrome-PWA-v16
          path: QAMVIO-Chrome-PWA-v16.zip
          if-no-files-found: error
          retention-days: 14
