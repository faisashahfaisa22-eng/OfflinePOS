name: Build QAMVIO Flutter APK
on:
  push:
    branches: [ flutter/qamvio-core ]
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-flutter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter platform files
        run: flutter create --platforms=android --project-name qamvio_pos .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QAMVIO-Flutter-Core-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
