name: Build OfflinePOS Mobile v8.3.3 Status WhatsApp AAB + APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rebuild v8.3.3 app
        shell: bash
        run: |
          set -euo pipefail

          test -f AndroidManifest-cloud-v8.3.2.xml
          test -f MainActivity.java
          test -f index.html
          test -f mobile-ui-patch.html
          test -f mobile-data-cleanup-v8.2.html
          test -f online-offline-sync-v8.3.html
          test -f mobile-backup-cloud-fix-v8.3.1.html
          test -f cloud-status-whatsapp-v8.3.3.html

          mkdir -p app/src/main/java/com/offlinepos/accounts
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp AndroidManifest-cloud-v8.3.2.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/offlinepos/accounts/MainActivity.java
          cp strings.xml app/src/main/res/values/strings.xml
          cp styles.xml app/src/main/res/values/styles.xml
          cp ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml

          python3 - <<'PY'
          from pathlib import Path

          core=Path("index.html").read_text(encoding="utf-8")
          patches=[
              Path("mobile-ui-patch.html").read_text(encoding="utf-8"),
              Path("mobile-data-cleanup-v8.2.html").read_text(encoding="utf-8"),
              Path("online-offline-sync-v8.3.html").read_text(encoding="utf-8"),
              Path("mobile-backup-cloud-fix-v8.3.1.html").read_text(encoding="utf-8"),
              Path("cloud-status-whatsapp-v8.3.3.html").read_text(encoding="utf-8"),
          ]
          merged=core.replace("</body>","\n".join(patches)+"\n</body>",1)
          Path("app/src/main/assets/index.html").write_text(merged,encoding="utf-8")

          java_path=Path("app/src/main/java/com/offlinepos/accounts/MainActivity.java")
          java=java_path.read_text(encoding="utf-8")
          anchor="settings.setAllowFileAccess(true);"
          if "setAllowUniversalAccessFromFileURLs(true)" not in java:
              if anchor not in java:
                  raise SystemExit("WebSettings anchor missing")
              java=java.replace(
                  anchor,
                  anchor+"\n        settings.setAllowFileAccessFromFileURLs(true);\n        settings.setAllowUniversalAccessFromFileURLs(true);",
                  1
              )
          java_path.write_text(java,encoding="utf-8")
          PY

          cat > app/build.gradle <<'GRADLE_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.offlinepos.accounts'
              compileSdk 36

              defaultConfig {
                  applicationId "com.offlinepos.accounts"
                  minSdk 26
                  targetSdk 36
                  versionCode 7
                  versionName "8.3.3"
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE_EOF
          touch app/proguard-rules.pro

      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/offlinepos-upload.jks"

      - name: Build signed release AAB and APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/offlinepos-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: offlinepos
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify signatures
        shell: bash
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePOS-PlayStore-AAB-v8.3.3
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePOS-StatusWhatsApp-APK-v8.3.3
          path: app/build/outputs/apk/release/app-release.apk
