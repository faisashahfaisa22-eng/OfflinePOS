name: Build POS & Accounts Pro Windows 10

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Windows desktop app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-build | Out-Null
          New-Item -ItemType Directory -Force -Path windows-build\app | Out-Null

          @'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          let html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');

          // Keep the Windows app on the same cloud/login/data model as Android.
          const patches = [
            'online-offline-sync-v8.3.html',
            'mobile-backup-cloud-fix-v8.3.1.html',
            'branding-v8.3.5.html'
          ];

          for (const file of patches) {
            const full = path.join(root, file);
            if (!fs.existsSync(full)) throw new Error(`Required file missing: ${file}`);
            const patch = fs.readFileSync(full, 'utf8');
            html = html.includes('</body>')
              ? html.replace('</body>', `\n${patch}\n</body>`)
              : html + '\n' + patch;
          }

          fs.writeFileSync(path.join(root, 'windows-build', 'app', 'index.html'), html, 'utf8');
          '@ | Set-Content -Encoding UTF8 merge-desktop.js

          node merge-desktop.js

          if (Test-Path ic_launcher.png) {
            Copy-Item ic_launcher.png windows-build\icon.png -Force
          }

          @'
          const { app, BrowserWindow, shell, session } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 820,
              minWidth: 900,
              minHeight: 650,
              show: false,
              autoHideMenuBar: true,
              icon: path.join(__dirname, 'icon.png'),
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                sandbox: true
              }
            });

            win.loadFile(path.join(__dirname, 'app', 'index.html'));
            win.once('ready-to-show', () => {
              win.maximize();
              win.show();
            });

            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^https?:/i.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
          }

          app.whenReady().then(() => {
            session.defaultSession.setPermissionRequestHandler((_wc, permission, callback) => {
              callback(['notifications', 'clipboard-sanitized-write'].includes(permission));
            });
            createWindow();
            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@ | Set-Content -Encoding UTF8 windows-build\main.js

          @'
          {
            "name": "pos-accounts-pro-windows",
            "version": "1.0.0",
            "description": "POS & Accounts Pro for Windows 10/11",
            "main": "main.js",
            "author": "POS & Accounts Pro",
            "license": "UNLICENSED",
            "scripts": {
              "dist": "electron-builder --win nsis --x64"
            },
            "devDependencies": {
              "electron": "^38.0.0",
              "electron-builder": "^26.0.12"
            },
            "build": {
              "appId": "com.offlinepos.accounts.desktop",
              "productName": "POS & Accounts Pro",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.js",
                "app/**/*",
                "icon.png"
              ],
              "win": {
                "target": [
                  {
                    "target": "nsis",
                    "arch": ["x64"]
                  }
                ],
                "icon": "icon.png"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "POS & Accounts Pro"
              }
            }
          }
          '@ | Set-Content -Encoding UTF8 windows-build\package.json

      - name: Install desktop dependencies
        shell: pwsh
        working-directory: windows-build
        run: npm install

      - name: Build Windows EXE
        shell: pwsh
        working-directory: windows-build
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: POS-Accounts-Pro-Windows-10
          path: windows-build/dist/*.exe
          if-no-files-found: error
