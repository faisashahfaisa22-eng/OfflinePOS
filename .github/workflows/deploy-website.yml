name: Deploy QAMVIO Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"

  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish Play Store AAB release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=QAMVIO-PlayStore-AAB-v16&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .id // empty')"
          test -n "$ARTIFACT_ID"
          rm -rf /tmp/qamvio-aab /tmp/qamvio-aab.zip
          mkdir -p /tmp/qamvio-aab
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/qamvio-aab.zip
          unzip -j /tmp/qamvio-aab.zip '*.aab' -d /tmp/qamvio-aab
          AAB="$(find /tmp/qamvio-aab -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -s "$AAB"
          cp "$AAB" /tmp/QAMVIO-v16.0.0-build16.aab
          gh release upload v1.0.0 /tmp/QAMVIO-v16.0.0-build16.aab --clobber --repo "$GITHUB_REPOSITORY"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload QAMVIO website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website

      - name: Deploy QAMVIO website
        id: deployment
        uses: actions/deploy-pages@v4
