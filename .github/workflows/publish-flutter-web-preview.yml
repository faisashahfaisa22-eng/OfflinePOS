name: Publish QAMVIO Laptop Preview

on:
  push:
    branches:
      - release/flutter-web-v16
    paths:
      - ".github/workflows/publish-flutter-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qamvio-laptop-preview-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout laptop branch
        uses: actions/checkout@v4
        with:
          ref: release/flutter-web-v16
          path: appsrc

      - name: Checkout main website
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ github.token }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: appsrc/flutter_app
        run: flutter pub get

      - name: Build laptop web preview
        working-directory: appsrc/flutter_app
        run: |
          flutter build web --release --base-href /app-preview/

      - name: Publish preview into website tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/website/app-preview
          mkdir -p site/website/app-preview
          cp -a appsrc/flutter_app/build/web/. site/website/app-preview/

          python3 - <<'PY'
          from pathlib import Path

          index = Path("site/website/app-preview/index.html")
          text = index.read_text(encoding="utf-8")
          marker = "<head>"
          inject = """<head>
            <meta name="robots" content="noindex,nofollow">
            <meta name="qamvio-preview" content="Laptop beta preview">
          """
          text = text.replace(marker, inject, 1)
          index.write_text(text, encoding="utf-8")

          landing = Path("site/website/laptop.html")
          landing.write_text("""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,nofollow">
            <title>QAMVIO Laptop Beta</title>
            <style>
              body{font-family:Arial,sans-serif;background:#071b38;color:#fff;margin:0;padding:32px}
              main{max-width:760px;margin:8vh auto;background:#0d2b55;padding:28px;border-radius:18px}
              a{display:inline-block;background:#fff;color:#075ee8;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:700}
              .warn{background:#3b2b00;padding:14px;border-radius:10px;margin:18px 0;line-height:1.5}
            </style>
          </head>
          <body>
            <main>
              <h1>QAMVIO Laptop Beta</h1>
              <p>This is an early Chrome/PWA preview for laptop testing.</p>
              <div class="warn"><strong>Important:</strong> Do not use real business data yet. Browser encrypted local-storage verification is still in progress.</div>
              <p>The Android/iPhone versions are separate from this preview.</p>
              <a href="/app-preview/">Open Laptop Preview</a>
            </main>
          </body>
          </html>
          """, encoding="utf-8")
          PY

      - name: Commit preview to main
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/app-preview website/laptop.html
          if git diff --cached --quiet; then
            echo "Preview unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Publish QAMVIO laptop beta preview"
          git push origin HEAD:main
