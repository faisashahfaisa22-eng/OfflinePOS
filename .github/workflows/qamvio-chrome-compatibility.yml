name: QAMVIO Chrome compatibility check
on:
  push:
    branches: [feature/license-activation]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/qamvio-chrome-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Chrome Flutter platform files
        run: flutter create --platforms=web --project-name=qamvio_pos .
      - name: Fetch dependencies
        run: flutter pub get
      - name: Check whether current mobile code can build for Chrome
        run: flutter build web --release --base-href /app/
      - name: Upload Chrome candidate only after successful compilation
        uses: actions/upload-artifact@v4
        with:
          name: QAMVIO-Chrome-Candidate-From-License-Branch
          path: flutter_app/build/web/
          if-no-files-found: error
