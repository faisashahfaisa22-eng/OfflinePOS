name: QAMVIO Flutter license checks
on:
  push:
    branches: [feature/license-activation]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/qamvio-license-ci.yml'
  workflow_dispatch:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Generate missing Android Flutter project scaffold
        run: flutter create --platforms=android --project-name=qamvio_pos .
      - name: Build Android debug APK (licensing disabled until live E2E verification)
        run: flutter build apk --debug --dart-define=QAMVIO_REQUIRE_LICENSE=false
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: qamvio-license-test-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
