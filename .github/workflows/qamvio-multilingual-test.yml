name: QAMVIO Multilingual Tests, APK & Web

on:
  push:
    branches:
      - feature/qamvio-multilingual
  pull_request:
    branches:
      - release/flutter-play-v16
      - feature/qamvio-multilingual
  workflow_dispatch:

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android and Web project files
        run: flutter create --platforms=android,web --project-name qamvio_pos .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build QAMVIO Web for Chrome
        run: flutter build web --release

      - name: Upload QAMVIO Web for Chrome
        uses: actions/upload-artifact@v4
        with:
          name: QAMVIO-Web-Chrome
          path: flutter_app/build/web
          if-no-files-found: error
          retention-days: 30

      - name: Build installable Android APK
        run: flutter build apk --debug

      - name: Upload QAMVIO Android APK
        uses: actions/upload-artifact@v4
        with:
          name: QAMVIO-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
