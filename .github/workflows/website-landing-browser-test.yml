name: Temporary website landing browser test

on:
  push:
    branches:
      - website/landing-improvements-v2
    paths:
      - "website/**"
      - ".github/workflows/website-landing-browser-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Test landing page locally
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 --directory website >/tmp/qamvio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          errors = []
          expected = {
              "en": ("ltr", "Offline Android POS, Inventory & Business Accounts"),
              "ps": ("rtl", "د Android لپاره آفلاین POS، سټاک او حسابونه"),
              "fa": ("rtl", "POS آفلاین Android، موجودی و حساب‌های کاروبار"),
              "ur": ("rtl", "Android کے لیے آف لائن POS، اسٹاک اور کاروباری اکاؤنٹس"),
          }

          def check_links(page):
              apk = page.locator('a[href*=".apk"]')
              assert apk.count() == 2, f"Expected hero + CTA APK links, found {apk.count()}"
              assert page.locator('a[href*=".aab"]').count() == 0, "AAB link must not be public"
              assert "AAB" not in page.locator("body").inner_text(), "Visible AAB text must be removed"
              hrefs = page.locator("a").evaluate_all("(els) => els.map(e => e.getAttribute('href'))")
              for required in [
                  "mailto:info@qamvio.com",
                  "privacy.html",
                  "terms.html",
                  "https://www.youtube.com/@Qamvio",
                  "https://www.facebook.com/share/19Y35Wp28g/",
                  "https://www.instagram.com/qamvio/",
              ]:
                  assert required in hrefs, f"Missing link: {required}"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width in (360, 1280):
                  context = browser.new_context(viewport={"width": width, "height": 900})
                  page = context.new_page()
                  page.on("console", lambda msg, w=width: errors.append(f"{w}px console {msg.type}: {msg.text}") if msg.type == "error" else None)
                  page.on("pageerror", lambda exc, w=width: errors.append(f"{w}px pageerror: {exc}"))

                  page.goto("http://127.0.0.1:8000/index.html", wait_until="networkidle")
                  assert page.locator("html").get_attribute("lang") == "en"
                  assert page.locator("html").get_attribute("dir") == "ltr"
                  assert page.locator("h1").inner_text() == expected["en"][1]
                  check_links(page)

                  for lang, (direction, heading) in expected.items():
                      page.select_option("#languagePicker", lang)
                      page.wait_for_timeout(50)
                      assert page.locator("html").get_attribute("lang") == lang
                      assert page.locator("html").get_attribute("dir") == direction
                      assert page.locator("h1").inner_text() == heading
                      assert page.evaluate("localStorage.getItem('qamvio-language')") == lang
                      overflow = page.evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth")
                      if overflow:
                          offenders = page.locator("body *").evaluate_all("""(els) => els.map((el) => {
                            const r = el.getBoundingClientRect();
                            return {tag: el.tagName, cls: el.className || "", text: (el.textContent || "").trim().slice(0, 80), left: r.left, right: r.right, width: r.width};
                          }).filter(x => x.left < -0.5 || x.right > window.innerWidth + 0.5).slice(0, 12)""")
                          raise AssertionError(f"Horizontal overflow at {width}px / {lang}: {offenders}")

                  page.select_option("#languagePicker", "ps")
                  page.reload(wait_until="networkidle")
                  assert page.locator("html").get_attribute("lang") == "ps"
                  assert page.locator("html").get_attribute("dir") == "rtl"
                  assert page.locator("h1").inner_text() == expected["ps"][1]

                  context.close()

              browser.close()

          assert not errors, "\n".join(errors)
          print("PASS: 360px and 1280px; en/ps/fa/ur; RTL; localStorage; links; no AAB; no horizontal overflow; no console/page errors")
          PY
