<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QAMVIO POS — Email Confirmed</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{font-family:Inter,system-ui,Arial,sans-serif;color:#0f172a;background:#f8fafc}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:30px;box-shadow:0 18px 50px rgba(15,23,42,.12);text-align:center}
    .logo{width:68px;height:68px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(145deg,#111827,#4f46e5);color:#fff;font-size:30px;font-weight:800}
    h1{margin:0 0 10px;font-size:28px} p{color:#475569;line-height:1.6}
    .ok{display:inline-block;margin-top:8px;padding:10px 16px;border-radius:999px;background:#ecfdf5;color:#166534;font-weight:800}
    .ps{direction:rtl;font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif;margin-top:18px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Q</div>
    <h1>Email confirmed ✅</h1>
    <p>Your QAMVIO cloud account is ready. Return to the QAMVIO POS app and use <b>Login to Cloud</b> or <b>Restore Account from Cloud</b>.</p>
    <div class="ok">QAMVIO Cloud Ready</div>
    <p class="ps">ستا ایمیل تایید شو ✅ اوس QAMVIO POS اپ ته بېرته لاړ شه او د Cloud Login یا Restore Account from Cloud له لارې ننوځه.</p>
  </main>
</body>
</html>
